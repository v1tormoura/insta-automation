services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - instaflow

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - instaflow

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Fuso do agendamento: janela, weekdays e proximo horario sao
      # calculados em horario local. Sem isto o container roda em UTC e a
      # janela 18:00-23:00 viraria 15:00-20:00 no horario de Brasilia.
      TZ: America/Sao_Paulo
      MONGO_URI: mongodb://mongo:27017/insta-automation
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HEADLESS: "true"
      INSTAGRAPI_SERVICE_URL: http://instagrapi-svc:8000
    depends_on:
      - mongo
      - redis
      - instagrapi-svc
    volumes:
      - uploads:/app/uploads
      - sessions:/app/sessions
      - data:/app/data
      - ./backend/src:/app/src   # código-fonte montado: restart basta, sem rebuild
    ports:
      - "3000:3000"
    command: node src/app.js
    networks:
      - instaflow

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Fuso do agendamento: janela, weekdays e proximo horario sao
      # calculados em horario local. Sem isto o container roda em UTC e a
      # janela 18:00-23:00 viraria 15:00-20:00 no horario de Brasilia.
      TZ: America/Sao_Paulo
      MONGO_URI: mongodb://mongo:27017/insta-automation
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HEADLESS: "true"
      INSTAGRAPI_SERVICE_URL: http://instagrapi-svc:8000
    depends_on:
      - mongo
      - redis
      - instagrapi-svc
    volumes:
      - uploads:/app/uploads
      - sessions:/app/sessions
      - data:/app/data
      - ./backend/src:/app/src   # código-fonte montado: restart basta, sem rebuild
    command: node src/queue/worker.js
    networks:
      - instaflow

  video-render-worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/insta-automation
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HEADLESS: "true"
    depends_on:
      - mongo
      - redis
    volumes:
      - uploads:/app/uploads
      - sessions:/app/sessions
      - data:/app/data
      - ./backend/src:/app/src
    command: node src/queue/videoRenderWorker.js
    networks:
      - instaflow

  instagrapi-svc:
    build: ./instagrapi-service
    restart: unless-stopped
    environment:
      # Fuso do agendamento: janela, weekdays e proximo horario sao
      # calculados em horario local. Sem isto o container roda em UTC e a
      # janela 18:00-23:00 viraria 15:00-20:00 no horario de Brasilia.
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      # Build do app Instagram usada no payload de login. Vazio = padrão da
      # biblioteca. Aceita apenas valores de config.APP_SETTINGS — hoje
      # 428.0.0.47.67 (padrão), 385.0.0.47.74 e 364.0.0.35.86. Trocar aqui é o
      # caminho quando o Instagram recusa o login com credencial válida
      # (error_type=bad_password no site funcionando).
      INSTAGRAPI_APP_VERSION: ${INSTAGRAPI_APP_VERSION:-}
      # Contexto regional do cliente. O padrao da biblioteca e dos EUA
      # (US/1/en_US/UTC-4); rodando daqui isso contradizia o IP e o idioma
      # das contas, e a contradicao e sinal de automacao para o Instagram.
      #
      # COUNTRY_CODE merece atencao: ele entra no payload do login como
      # `country_codes` e participa de como o Instagram interpreta o
      # identificador. Se o login passar a responder `invalid_user` para
      # conta que existe, teste com 1 antes de procurar em outro lugar.
      INSTAGRAPI_COUNTRY: ${INSTAGRAPI_COUNTRY:-BR}
      INSTAGRAPI_COUNTRY_CODE: ${INSTAGRAPI_COUNTRY_CODE:-55}
      INSTAGRAPI_LOCALE: ${INSTAGRAPI_LOCALE:-pt_BR}
      INSTAGRAPI_TZ_OFFSET_HOURS: ${INSTAGRAPI_TZ_OFFSET_HOURS:--3}
      INSTAGRAPI_TZ_NAME: ${INSTAGRAPI_TZ_NAME:-America/Sao_Paulo}
      GLOBAL_PROXY: ${GLOBAL_PROXY:-}
      # Sessao fixa no proxy rotativo: um identificador por conta faz o
      # fornecedor devolver sempre o MESMO IP para aquela conta. Sem isto o
      # IP muda a cada conexao, e para o Instagram a mesma conta saltando de
      # endereco e padrao de conta invadida.
      #
      # A sintaxe muda por fornecedor. `{sessao}` e substituido pelo
      # identificador da conta:
      #   axtron / geo por parametro   ;session.{sessao}      (padrao)
      #   Bright Data, Smartproxy      -session-{sessao}
      #   Oxylabs                      -sessid-{sessao}
      #   IPRoyal                      _session-{sessao}_lifetime-30m
      # Vazio desliga a fixacao (use com IP dedicado, que nao rotaciona).
      # Vazio = sem fixação de IP por conta. Opt-in de propósito: fornecedor
      # que não reconhece o sufixo recusa a credencial inteira com 407, e aí
      # nenhuma conta loga. Ponha a sintaxe do SEU fornecedor aqui só depois
      # de confirmar com scripts/sondar-proxy.sh (ex.: ";session.{sessao}").
      PROXY_SESSAO_MOLDE: ${PROXY_SESSAO_MOLDE-}
    volumes:
      - uploads:/app/uploads
    # No ports: — internal Docker network only; never exposed to the host
    networks:
      - instaflow

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3001:3001"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - instaflow

volumes:
  mongo_data:
  redis_data:
  uploads:
  sessions:
  data:

networks:
  instaflow:
    driver: bridge
