# Nexora — stack completa: MongoDB, Redis, API, workers e frontend (nginx).
#
#   cp .env.example .env   # preencha os segredos e a integração da Meta
#   docker compose up -d --build
#
# O frontend (porta 8080) faz proxy de /api e /public para a API, então tudo
# fica numa origem só. Em produção, coloque um proxy com TLS na frente
# (Caddy, Traefik, Cloudflare): a Meta exige HTTPS no redirect do OAuth e
# precisa baixar as mídias por uma URL pública.

x-log: &log
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-app-env: &app-env
  MONGO_URI: mongodb://mongo:27017/nexora
  REDIS_URL: redis://redis:6379
  TZ: America/Sao_Paulo

services:
  mongo:
    <<: *log
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *log
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ exige noeviction: com despejo de chaves, jobs podem sumir da fila.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    <<: *log
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: nexora-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      NEXORA_PROCESS: api
    volumes:
      - storage:/data/storage
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  worker:
    <<: *log
    image: nexora-api:latest
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      <<: *app-env
      NEXORA_PROCESS: worker
    depends_on:
      api: { condition: service_started }
    # Escala horizontal: `docker compose up -d --scale worker=3`. O isolamento
    # por conta e o limite por cliente ficam no Redis, não no processo.
    stop_grace_period: 60s

  web:
    <<: *log
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }

volumes:
  mongo_data:
  redis_data:
  storage:
