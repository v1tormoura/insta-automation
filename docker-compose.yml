services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - instaflow

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - instaflow

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Fuso do agendamento: janela, weekdays e proximo horario sao
      # calculados em horario local. Sem isto o container roda em UTC e a
      # janela 18:00-23:00 viraria 15:00-20:00 no horario de Brasilia.
      TZ: America/Sao_Paulo
      MONGO_URI: mongodb://mongo:27017/insta-automation
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HEADLESS: "true"
      INSTAGRAPI_SERVICE_URL: http://instagrapi-svc:8000
    depends_on:
      - mongo
      - redis
      - instagrapi-svc
    volumes:
      - uploads:/app/uploads
      - sessions:/app/sessions
      - data:/app/data
      - ./backend/src:/app/src   # código-fonte montado: restart basta, sem rebuild
    ports:
      - "3000:3000"
    command: node src/app.js
    networks:
      - instaflow

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Fuso do agendamento: janela, weekdays e proximo horario sao
      # calculados em horario local. Sem isto o container roda em UTC e a
      # janela 18:00-23:00 viraria 15:00-20:00 no horario de Brasilia.
      TZ: America/Sao_Paulo
      MONGO_URI: mongodb://mongo:27017/insta-automation
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HEADLESS: "true"
      INSTAGRAPI_SERVICE_URL: http://instagrapi-svc:8000
    depends_on:
      - mongo
      - redis
      - instagrapi-svc
    volumes:
      - uploads:/app/uploads
      - sessions:/app/sessions
      - data:/app/data
      - ./backend/src:/app/src   # código-fonte montado: restart basta, sem rebuild
    command: node src/queue/worker.js
    networks:
      - instaflow

  video-render-worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/insta-automation
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      HEADLESS: "true"
    depends_on:
      - mongo
      - redis
    volumes:
      - uploads:/app/uploads
      - sessions:/app/sessions
      - data:/app/data
      - ./backend/src:/app/src
    command: node src/queue/videoRenderWorker.js
    networks:
      - instaflow

  instagrapi-svc:
    build: ./instagrapi-service
    restart: unless-stopped
    environment:
      # Fuso do agendamento: janela, weekdays e proximo horario sao
      # calculados em horario local. Sem isto o container roda em UTC e a
      # janela 18:00-23:00 viraria 15:00-20:00 no horario de Brasilia.
      TZ: America/Sao_Paulo
      PYTHONUNBUFFERED: "1"
      # Build do app Instagram usada no payload de login. Vazio = padrão da
      # biblioteca. Aceita apenas valores de config.APP_SETTINGS — hoje
      # 428.0.0.47.67 (padrão), 385.0.0.47.74 e 364.0.0.35.86. Trocar aqui é o
      # caminho quando o Instagram recusa o login com credencial válida
      # (error_type=bad_password no site funcionando).
      INSTAGRAPI_APP_VERSION: ${INSTAGRAPI_APP_VERSION:-}
      GLOBAL_PROXY: ${GLOBAL_PROXY:-}
    volumes:
      - uploads:/app/uploads
    # No ports: — internal Docker network only; never exposed to the host
    networks:
      - instaflow

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3001:3001"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - instaflow

volumes:
  mongo_data:
  redis_data:
  uploads:
  sessions:
  data:

networks:
  instaflow:
    driver: bridge
