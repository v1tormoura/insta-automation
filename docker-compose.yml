# Servidor: a API (com o worker no mesmo processo) e o túnel da Cloudflare.
# Banco no Supabase, painel no Cloudflare Pages — nada disso roda aqui.
#
#   cp .env.example .env   # e preencha
#   docker compose up -d --build

x-log: &log
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  app:
    <<: *log
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      # Biblioteca de mídia e arquivos processados. A Meta baixa daqui.
      - uploads:/app/uploads
    # Só no localhost do servidor: o acesso público entra pelo túnel.
    # APP_PORT muda a porta local quando a 3000 já está em uso.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  tunnel:
    <<: *log
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?defina TUNNEL_TOKEN no .env}
    depends_on:
      - app

volumes:
  uploads:
