<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="MouraFlow">
  <!--
    Monograma MouraFlow.

    Um M em traço contínuo, com o vale central marcado por um ponto sólido.
    O ponto é o que separa esta marca de um M qualquer: ele lê como o começo
    do percurso, e amarra a letra ao que o produto faz.

    Traço de 4.4 num viewBox de 32 é deliberado — a marca vive a 28px na barra
    lateral e a 16px na aba do navegador, e abaixo dessa espessura ela some no
    favicon. Toda a geometria está em coordenadas inteiras ou de meio ponto
    para não borrar em telas sem escala fracionária.
  -->
  <defs>
    <linearGradient id="mf-marca" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#a770ff"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="mf-ponto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a770ff"/>
    </linearGradient>
  </defs>

  <path d="M5 25V9.5l11 9 11-9V25"
        fill="none" stroke="url(#mf-marca)" stroke-width="4.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="18.5" r="3.2" fill="url(#mf-ponto)"/>
</svg>
