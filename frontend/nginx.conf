# ── Resolução do backend em tempo de requisição ───────────────────────────────
#
# `proxy_pass http://backend:3000` com hostname literal resolve UMA VEZ, na
# inicialização, e o nginx guarda aquele IP para sempre. Como o Docker dá um
# IP novo a cada `docker compose restart backend`, o nginx passava a bater num
# endereço morto e devolvia 502 em tudo — o site inteiro fora do ar depois de
# um restart do backend, sem nada de errado com o backend.
#
# Duas peças resolvem: `resolver` aponta para o DNS embutido do Docker, e a
# variável no `proxy_pass` é o que obriga o nginx a resolver A CADA
# REQUISIÇÃO em vez de no boot — é a presença da variável, não o resolver
# sozinho, que muda esse comportamento.
#
# `$request_uri` precisa ser explícito: quando `proxy_pass` contém variável,
# o nginx para de repassar o caminho original automaticamente. Sem ele, toda
# rota chegaria ao backend como "/".
resolver 127.0.0.11 valid=10s ipv6=off;

# Alguns caminhos existem tanto no Express quanto como página do SPA
# (/accounts, /posts, /settings…). Para desempatar, olhamos o Accept:
# navegação de navegador pede text/html; XHR/fetch/EventSource não.
# Sem isso, um F5 em /accounts entrega o JSON da API em vez do app.
map $http_accept $spa_nav {
    default       0;
    "~*text/html" 1;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name instaflow.pro www.instaflow.pro;
    return 301 https://instaflow.pro$request_uri;
}

# Frontend + API — tudo no 443
server {
    listen 443 ssl;
    server_name instaflow.pro www.instaflow.pro;

    ssl_certificate     /etc/letsencrypt/live/instaflow.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/instaflow.pro/privkey.pem;

    set $backend_api http://backend:3000;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 500M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # SSE — sem buffering, timeout longo
    location = /events {
        proxy_pass $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_set_header Host $host;
    }

    # Rotas que existem SÓ no Express — nenhuma delas é página do SPA,
    # então vão sempre para o backend (inclui /oauth-callback, que o
    # navegador acessa direto e o Express redireciona).
    location ~* ^/(uploads|auth|api|oauth|oauth-callback|image-proxy|dashboard|media|loops|profile-edit|insights|analytics|abtests|repost|viral|downloader|meta-apps|multilogin|proxy)(/|$) {
        proxy_pass $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 500M;
    }

    # Caminhos compartilhados entre Express e SPA: F5 do navegador recebe o
    # app; chamada de API (XHR/fetch) continua indo para o backend.
    location ~* ^/(accounts|posts|logs|settings|sessions|health|legends|warmup|jobs|promo|proxies|video-templates|video-batches)(/|$) {
        if ($spa_nav) {
            rewrite ^ /index.html last;
        }
        proxy_pass $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 500M;
    }

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Porta 3001 mantida para retrocompatibilidade (caso o firewall abra novamente)
server {
    listen 3001 ssl;
    server_name instaflow.pro;

    ssl_certificate     /etc/letsencrypt/live/instaflow.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/instaflow.pro/privkey.pem;

    client_max_body_size 500M;

    set $backend_api http://backend:3000;

    location /events {
        proxy_pass $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
